<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Logo Loader</title>
    <style>
        body {
            /* Dark background to make the neon pop */
            background-color: #121212;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .loader-container {
            width: 180px;
            /* Adjust size here */
            height: 180px;
            position: relative;
        }

        .logo-svg {
            width: 100%;
            height: 100%;
            overflow: visible;
            /* Important: lets the glow spill outside the box */
        }

        .logo-path {
            /* Base appearance */
            fill: #00ff94;
            stroke: #00ff94;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;

            /* Initial state for animation */
            fill-opacity: 0;
            stroke-dasharray: 1200;
            /* Needs to be longer than the path length */
            stroke-dashoffset: 1200;

            /* The animation sequence */
            animation:
                lineDraw 3s cubic-bezier(0.4, 0, 0.2, 1) infinite,
                fillFade 3s cubic-bezier(0.4, 0, 0.2, 1) infinite,
                neonGlow 3s ease-in-out infinite;
        }

        /* 1. Draw the outline */
        @keyframes lineDraw {
            0% {
                stroke-dashoffset: 1200;
            }

            35% {
                stroke-dashoffset: 0;
            }

            100% {
                stroke-dashoffset: 0;
            }
        }

        /* 2. Fade in the solid fill */
        @keyframes fillFade {

            0%,
            35% {
                fill-opacity: 0;
            }

            50% {
                fill-opacity: 1;
            }

            90% {
                fill-opacity: 1;
            }

            100% {
                fill-opacity: 0;
            }
        }

        /* 3. Pulsing Glow Effect */
        @keyframes neonGlow {

            0%,
            100% {
                filter: drop-shadow(0 0 1px #00ff94) drop-shadow(0 0 2px rgba(0, 255, 148, 0.1));
            }

            50% {
                filter: drop-shadow(0 0 2px #00ff94) drop-shadow(0 0 5px rgba(0, 255, 148, 0.3));
            }
        }
    </style>
</head>

<body>

    <div class="loader-container">
        <svg class="logo-svg" viewBox="0 0 375 375" version="1.0" xmlns="http://www.w3.org/2000/svg">
            <!-- 
                 I extracted the path data from your original SVG. 
                 I removed the clip-path wrapper to simplify the stroke animation 
                 and allow the glow to render correctly.
            -->
            <path class="logo-path"
                d="M 184.53125 191.890625 L 154.050781 191.890625 L 154.050781 226.949219 L 130.230469 254.410156 L 129.96875 254.410156 L 129.96875 168.121094 L 154.050781 191.890625 L 154.050781 168.121094 L 205.179688 168.121094 Z M 245.023438 122.300781 L 225.570312 144.664062 L 129.96875 144.664062 L 129.96875 120.582031 L 245.023438 120.582031 Z M 245.023438 122.300781 " />
        </svg>
    </div>

</body>

</html>
