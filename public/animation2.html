<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liquid Logo Loader</title>
    <style>
        body {
            background-color: #121212;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            font-family: sans-serif;
        }

        .loader-container {
            width: 180px;
            height: 180px;
            position: relative;
            /* Add a subtle reflection/glow to the whole container */
            filter: drop-shadow(0 0 10px rgba(0, 255, 148, 0.1));
        }

        .logo-svg {
            width: 100%;
            height: 100%;
            overflow: visible;
        }

        /* 1. The Background Track (Dim Outline) */
        .logo-track {
            fill: none;
            stroke: #003319;
            /* Very dark green */
            stroke-width: 2;
        }

        /* 2. The Liquid Wave */
        .wave-fill {
            fill: #00ff94;
            /* Neon Green */
            opacity: 0.9;
        }

        /* 3. The Animation Group that moves the wave up */
        .wave-group {
            animation: fillUp 4s ease-in-out infinite;
        }

        /* 4. The Animation that moves the wave sideways (ripple) */
        .wave-shape {
            animation: ripple 2s linear infinite;
        }

        /* Animation: Rise from bottom to top */
        @keyframes fillUp {
            0% {
                transform: translateY(380px);
                /* Start below the logo */
            }

            40% {
                transform: translateY(380px);
            }

            80% {
                transform: translateY(-50px);
                /* End above the logo */
            }

            90% {
                opacity: 1;
            }

            100% {
                transform: translateY(-50px);
                opacity: 0;
                /* Fade out to reset */
            }
        }

        /* Animation: Move wave sideways to create ripple effect */
        @keyframes ripple {
            0% {
                transform: translateX(0);
            }

            100% {
                transform: translateX(-150px);
                /* Move one wave-length */
            }
        }

        /* Optional: A bright flash when it's full */
        .flash {
            fill: white;
            opacity: 0;
            animation: flashLight 4s ease-in-out infinite;
            pointer-events: none;
        }

        @keyframes flashLight {

            0%,
            75% {
                opacity: 0;
            }

            80% {
                opacity: 0.8;
            }

            100% {
                opacity: 0;
            }
        }
    </style>
</head>

<body>

    <div class="loader-container">
        <svg class="logo-svg" viewBox="0 0 375 375" version="1.0" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <!-- Define the Logo Path once to reuse it -->
                <path id="logoPath"
                    d="M 184.53125 191.890625 L 154.050781 191.890625 L 154.050781 226.949219 L 130.230469 254.410156 L 129.96875 254.410156 L 129.96875 168.121094 L 154.050781 191.890625 L 154.050781 168.121094 L 205.179688 168.121094 Z M 245.023438 122.300781 L 225.570312 144.664062 L 129.96875 144.664062 L 129.96875 120.582031 L 245.023438 120.582031 Z M 245.023438 122.300781" />

                <!-- Create a Mask using the Logo Path -->
                <clipPath id="logoClip">
                    <use href="#logoPath" />
                </clipPath>
            </defs>

            <!-- 1. Background Track -->
            <use href="#logoPath" class="logo-track" />

            <!-- 2. The Liquid Group (Clipped to the logo shape) -->
            <g clip-path="url(#logoClip)">
                <!-- This group moves UP -->
                <g class="wave-group">
                    <!-- This path moves SIDEWAYS (Ripple) -->
                    <!-- I drew a simple sine wave path that is wide enough to scroll -->
                    <path class="wave-shape wave-fill"
                        d="M 0 0 Q 37.5 15 75 0 T 150 0 T 225 0 T 300 0 T 375 0 T 450 0 T 525 0 V 500 H 0 Z"
                        transform="translate(-75, 0)" />
                </g>

                <!-- Flash Overlay -->
                <rect width="100%" height="100%" class="flash" />
            </g>
        </svg>
    </div>

</body>

</html>
